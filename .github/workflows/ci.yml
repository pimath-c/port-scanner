name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build CLI and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI
        run: make

      - name: Run automated tests
        run: make test

      - name: Sanity-check the CLI binary
        run: ./port-scanner --help

  gui-build:
    name: Build GTK3 GUI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK3 dev headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Build GUI
        run: make gui

  windows-build:
    name: Cross-compile Windows binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build Windows CLI + GUI
        run: make windows
